<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VIVART · Festival Internacional de Artes Vivas de Loja</title>
    <meta name="description" content="Agenda cultural, fichas de actividades, ¿Qué hay ahora? y panel editorial de VIVART." />
    <meta name="theme-color" content="#3b0f66" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/diseno.css" />
  </head>
  <body>
    <a class="saltar" href="#contenido">Saltar al contenido</a>

    <header class="cabecera">
      <div class="cabecera-interior">
        <a class="marca" href="/" data-enlace aria-label="VIVART, ir a la Agenda">
          <span class="marca-sello" aria-hidden="true">V</span>
          <span class="marca-textos">
            <span class="marca-nombre">VIVART</span>
            <span class="marca-lema">Artes vivas · Loja</span>
          </span>
        </a>
        <button type="button" class="boton-menu" id="boton-menu" aria-controls="navegacion" aria-expanded="false">
          <span class="icono-menu" aria-hidden="true"></span>
          <span>Menú</span>
        </button>
        <nav aria-label="Principal" id="navegacion" class="navegacion-principal"></nav>
      </div>
    </header>

    <output id="avisos" aria-live="polite" class="avisos"></output>

    <main id="contenido" tabindex="-1"></main>

    <footer class="pie">
      <div class="pie-franja" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="pie-interior">
        <div class="pie-marca-bloque">
          <p class="pie-logo">VIVART</p>
          <p class="pie-marca">Festival Internacional de Artes Vivas de Loja</p>
        </div>
        <nav class="pie-nav" aria-label="Pie de página">
          <a href="/agenda" data-enlace>Agenda</a>
          <a href="/mapa" data-enlace>Mapa</a>
          <a href="/recorrido" data-enlace>Mi recorrido</a>
          <a href="/pasaporte" data-enlace>Pasaporte</a>
        </nav>
        <p class="pie-nota">Entorno de demostración: horarios en hora local de Loja, sin cobros reales ni envío de correos reales.</p>
      </div>
    </footer>

    <nav class="barra-movil" id="barra-movil" aria-label="Navegación principal móvil"></nav>
    <!-- Alforjita, la asistente del festival, siempre a mano en la esquina inferior (ilustración oficial, usada con permiso) -->
    <button type="button" class="alforjita-flotante" id="alforjita-flotante" aria-haspopup="dialog">
      <span class="alforjita-flotante-globo" aria-hidden="true">¿Te ayudo?</span>
      <span class="alforjita-flotante-foto"><img src="/img/alforjita/alforjita-saludo.jpg" alt="" width="404" height="495" /></span>
      <span class="sr-only">Pregúntale a Alforjita, la asistente del festival</span>
    </button>
    <div id="modal-raiz" class="modal-raiz"></div>

    <noscript>
      <p class="aviso">Esta aplicación necesita JavaScript para mostrar la programación de VIVART.</p>
    </noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
