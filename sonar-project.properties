# Análisis de calidad y seguridad en SonarCloud (https://sonarcloud.io).
# La organización se define en la variable SONAR_ORGANIZATION del repositorio (no es un secreto).
sonar.projectKey=Nicolay404_VivArt
sonar.projectName=VIVART
sonar.sources=app
sonar.tests=app
sonar.test.inclusions=**/test/**
sonar.exclusions=**/node_modules/**,**/data/**,**/test/**
sonar.sourceEncoding=UTF-8
# La web (app/web) es código de navegador sin pruebas automáticas: se valida a mano (T067) y con la
# prueba de punta a punta de la entrada. Se excluye solo del cálculo de cobertura; el resto del análisis la incluye.
sonar.coverage.exclusions=app/web/**
# Cada servicio tiene su propia infraestructura (conexión a la base, errores y seguridad HTTP) a propósito:
# se despliegan por separado y no comparten una librería. Esos archivos se parecen entre servicios y se excluyen
# SOLO del cálculo de duplicados; el resto del análisis los sigue revisando.
sonar.cpd.exclusions=app/services/*/src/db.js,app/services/*/src/http/errors.js,app/services/*/src/http/security.js,app/services/*/src/http/session.js,app/services/*/src/config.js,app/services/*/src/app.js,app/services/*/src/server.js,app/services/*/src/clients/identidad.js,app/services/*/src/domain/permisos.js,app/services/*/test/helpers.js
