# Análisis de calidad y seguridad en SonarCloud (https://sonarcloud.io).
# La organización se define en la variable SONAR_ORGANIZATION del repositorio (no es un secreto).
sonar.projectKey=Nicolay404_VivArt
sonar.projectName=VIVART
sonar.sources=app
sonar.tests=app
sonar.test.inclusions=**/test/**
sonar.exclusions=**/node_modules/**,**/data/**,**/test/**
sonar.sourceEncoding=UTF-8
# La web (app/web) es código de navegador sin pruebas automáticas: se valida a mano (T067) y con la
# prueba de punta a punta de la entrada. Se excluye solo del cálculo de cobertura; el resto del análisis la incluye.
sonar.coverage.exclusions=app/web/**
